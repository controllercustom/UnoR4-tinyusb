sentence=TinyUSB device and host library for Arduino Uno R4 Minima and Nano R4.
paragraph=USB device (CDC, HID, MSC, MIDI, Audio, Vendor, USBTMC, DFU-RT, WebUSB) and USB host (CDC incl. FTDI/CP210x/PL2303/CH34x bridges, HID, MSC, MIDI, Audio, Printer, Hub) on the RA4M1 RUSB2 port. Ships an upstream TinyUSB master snapshot, which is what enables host mode: install the unor4tinyusb board package (recommended), or patch the stock core in place. Serial1 is the console. 48 examples.
